name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  agent-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      # Includes the ConPTY session tests in internal/session.
      - run: go test ./...
      - name: Smoke test the CLI against a running agent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go build -o hedera.exe ./cmd/hedera
          $env:HEDERA_HOME = Join-Path $env:RUNNER_TEMP "hedera-state"
          $agent = Start-Process -FilePath .\hedera.exe -ArgumentList "run" -PassThru -NoNewWindow `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP "agent.log")
          try {
            Start-Sleep -Seconds 3
            $id = .\hedera.exe new -d cmd.exe /d /c "echo smoke-ok& exit /b 5"
            Start-Sleep -Seconds 3
            .\hedera.exe ls
            $s = .\hedera.exe ls --json | ConvertFrom-Json | Where-Object id -eq $id
            if ($s.exit.code -ne 5) { throw "expected exit code 5, got $($s.exit | ConvertTo-Json)" }
            $long = .\hedera.exe new -d cmd.exe /d /c "ping -n 60 127.0.0.1 >nul"
            .\hedera.exe close --kill $long
            Start-Sleep -Seconds 2
            $s = .\hedera.exe ls --json | ConvertFrom-Json | Where-Object id -eq $long
            if ($s.status -ne "exited") { throw "kill did not end the session" }
            $settings = Join-Path $env:RUNNER_TEMP "settings.json"
            .\hedera.exe install-hooks --settings $settings
            $hooks = Get-Content $settings | ConvertFrom-Json
            if ($hooks.hooks.Stop[0].hooks[0].args[0] -ne "hook") { throw "hooks not in exec form" }
            .\hedera.exe install-service --print
          } finally {
            Stop-Process -Id $agent.Id -ErrorAction SilentlyContinue
            Get-Content (Join-Path $env:RUNNER_TEMP "agent.log") -ErrorAction SilentlyContinue
          }

  hederakit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/HederaKit
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      # Includes the fixture tests that keep the Swift and Go sides in step.
      - run: swift test

  ios-app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      # SwiftTerm compiles a Metal shader; newer Xcodes ship the Metal
      # toolchain as a separate download.
      - run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - run: xcodegen
      - name: Build and test on a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "simulator $udid"
          # CI has no Apple account, so build without the team in Hedera.xcconfig.
          xcodebuild -project Hedera.xcodeproj -scheme Hedera \
            -destination "platform=iOS Simulator,id=$udid" \
            -skipPackagePluginValidation -skipMacroValidation \
            HEDERA_TEAM_ID= \
            test

  protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: protocol/package-lock.json
      - run: npm ci
      - run: npm test

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
