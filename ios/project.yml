# XcodeGen project: `cd ios && xcodegen`, then open Hedera.xcodeproj.
# The .xcodeproj is generated and not checked in.

name: Hedera
options:
  deploymentTarget:
    iOS: "17.0" # proposed minimum; see docs/roadmap.md "Decisions still needed"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Hedera.xcconfig
  Release: Config/Hedera.xcconfig

packages:
  HederaKit:
    path: HederaKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"

targets:
  Hedera:
    type: application
    platform: iOS
    sources:
      - Hedera
    dependencies:
      - package: HederaKit
      - package: SwiftTerm
      - target: HederaNotificationService
    info:
      path: Hedera/Info.plist
      properties:
        CFBundleDisplayName: Hedera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Hedera uses the camera to scan the pairing code shown by `hedera pair`.
        NSFaceIDUsageDescription: Hedera locks with Face ID because it can run commands on your computers.
        CFBundleURLTypes:
          - CFBundleURLName: hedera-pair
            CFBundleURLSchemes: [hedera]
        ITSAppUsesNonExemptEncryption: false
        HederaRadixHost: $(HEDERA_RADIX_HOST)
        HederaKeychainGroup: $(AppIdentifierPrefix)$(HEDERA_BUNDLE_ID).shared
    entitlements:
      path: Hedera/Hedera.entitlements
      properties:
        # Xcode switches this to production when exporting for TestFlight.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # The app's own group comes first, so items without an explicit group
        # (machine records with their tokens) stay out of the shared one.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HEDERA_BUNDLE_ID)
          - $(AppIdentifierPrefix)$(HEDERA_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEDERA_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(HEDERA_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true

  # Decrypts end-to-end encrypted notification text (protocol/spec.md
  # section 7.4). It can read the push keys in the shared Keychain group and
  # nothing else.
  HederaNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - HederaNotificationService
    dependencies:
      - package: HederaKit
    info:
      path: HederaNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Hedera Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HederaKeychainGroup: $(AppIdentifierPrefix)$(HEDERA_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: HederaNotificationService/HederaNotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HEDERA_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEDERA_BUNDLE_ID).notificationservice
        DEVELOPMENT_TEAM: $(HEDERA_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  HederaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HederaTests
    dependencies:
      - target: Hedera
      - package: HederaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEDERA_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(HEDERA_TEAM_ID)
        GENERATE_INFOPLIST_FILE: true

schemes:
  Hedera:
    build:
      targets:
        Hedera: all
    test:
      targets:
        - HederaTests
